<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>This is for test</title>
    </head>
    <body>
        <h2>以下使用fetch測試不同連線方法</h2>
        <button onclick="connectPost();">POST連線</button>
        <script>
            async function connectPost(){
                let response=await fetch("/add",{
                    method:"POST",
                    body:JSON.stringify({"n1":5,"n2":3})
                });
                let data=await response.json();
                console.log(data)
            }
        </script>
        <h2>以下提供計算平方</h2>
        <form action="/square" >
            <input type="number" name="number" placeholder="Enter a number">

            <button type="submit">計算平方</button>
        </form>

        <h2>計算兩數相乘</h2>
        <form action="/multiply">
            <input type="number" name="n1" placeholder="Enter a number">
            <br/>
            <input type="number" name="n2" placeholder="Enter a number">
            <br/>
            <button type="submit">相乘</button>
        </form>

        <h2>連接到另一個網頁</h2>
        <div>
            <a href="/page.html" target="_blank">picture.com</a>
        </div>
    </body>
        
</html>
