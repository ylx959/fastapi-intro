[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fastapi-intro"
version = "0.1.0"
description = "A simple REST API for learning FastAPI."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
]

[tool.setuptools]
py-modules = ["main"]
